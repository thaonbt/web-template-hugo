baseURL = "https://thaonbt.github.io/web-template-hugo/"
title = "ThaoNguyen"

[module]
  [[module.imports]]
    path = "github.com/luizdepra/hugo-coder"

enableEmoji = true

[pagination]
  pagerSize = 6

[services]
  [services.disqus]
    # shortname = "yourdisqusshortname"

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Giá trị mặc định — dùng chung cho mọi ngôn ngữ trừ khi override trong [languages.xx.params]
[params]
  author = "ThaoNguyen"
  avatarURL = "images/avatar.png"       # thay bằng ảnh thật trong static/images/
  #gravatar = "john.doe@example.com"
  keywords = "blog,developer,tech"
  dateFormat = "January 2, 2006"
  since = 2026

# Hiện commit hash trong footer, trỏ về repo template này
commit = "https://github.com/thaonbt/web-template-hugo/tree/"

# Right To Left, shift content direction for languages such as Arabic
rtl = false

# Specify light/dark colorscheme
# Supported values:
# "auto" (use preference set by browser)
# "dark" (dark background, light foreground)
# "light" (light background, dark foreground) (default)
colorScheme = "auto"

# Hide the toggle button, along with the associated vertical divider
hideColorSchemeToggle = false

# Series see also post count
maxSeeAlsoItems = 5

# Custom CSS
customCSS = []

# Custom SCSS, file path is relative to Hugo's asset folder (default: {your project root}/assets)
customSCSS = ["scss/custom.scss"]

# Custom JS
customJS = []

# Custom remote JS files
customRemoteJS = []

[[params.social]]
  name = "Github"
  icon = "fa-brands fa-github fa-2x"
  weight = 1
  url = "https://github.com/thaonbt/"

[[params.social]]
  name = "RSS"
  icon = "fa-solid fa-rss fa-2x"
  weight = 2
  url = "https://thaonbt.github.io/index.xml"
  rel = "alternate"
  type = "application/rss+xml"

[taxonomies]
  category = "categories"
  series = "series"
  tag = "tags"
  author = "authors"

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false   # false: URL en không có prefix (/about/), true: có (/en/about/)
disableAliases = false    # false: Bật tính năng chuyển hướng tự động ở trang gốc
disableDefaultLanguageRedirect = false   # New in Hugo v0.140+: Cho phép tạo alias trang chủ chính xác
disableLanguages = ["vi"]

[languages]
  [languages.en]
    languageName = "English"
    weight = 1
    [languages.en.params]
      info = ["AI-Augmented Engineer", "QA Automation Engineer"]
      description = "ThaoNguyen's personal site"

    [[languages.en.menu.main]]
      name = "About"
      weight = 1
      pageRef = "/about/"  # pageRef khiến Hugo tự tính URL thật của trang (đã bao gồm đúng baseURL + subpath), thay vì bạn tự gõ tay chuỗi URL

    [[languages.en.menu.main]]
      name = "Blog"
      weight = 2
      pageRef = "/posts/"

    [[languages.en.menu.main]]
      name = "Projects"
      weight = 3
      pageRef = "/projects/"

  [languages.vi]
    languageName = "Tiếng Việt"
    title = "ThaoNguyen"
    weight = 2
    [languages.vi.params]
      info = ["Kỹ sư phần mềm úng dụng AI", "Kỹ sư tự động hoá"]
      description = "Trang cá nhân của ThaoNguyen"

    [[languages.vi.menu.main]]
      name = "Giới thiệu"
      weight = 1
      pageRef = "/about/"

    [[languages.vi.menu.main]]
      name = "Blog"
      weight = 2
      pageRef = "/posts/"

    [[languages.vi.menu.main]]
      name = "Dự án"
      weight = 3
      pageRef = "/projects/"