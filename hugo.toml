baseURL = "https://thaonbt.github.io"
title = "ThaoNguyen"

[module]
  [[module.imports]]
    path = "github.com/luizdepra/hugo-coder"

languageCode = "en"
defaultContentLanguage = "en"
enableEmoji = true

[pagination]
  pagerSize = 6

[services]
  [services.disqus]
    # shortname = "yourdisqusshortname"

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  author = "ThaoNguyen"
  description = "ThaoNguyen's personal site"
  keywords = "blog,developer,tech"
  info = ["Software Engineer"]
  avatarURL = "images/avatar.jpg"       # thay bằng ảnh thật trong static/images/
  dateFormat = "January 2, 2006"
  since = 2026

  # Hiện commit hash trong footer, trỏ về repo template này
  commit = "https://github.com/thaonbt/web-template-hugo/tree/"

  rtl = false
  colorScheme = "auto"
  hideColorSchemeToggle = false
  maxSeeAlsoItems = 5

  customCSS = []
  customSCSS = []
  customJS = []
  customRemoteJS = []

[taxonomies]
  category = "categories"
  series = "series"
  tag = "tags"
  author = "authors"

[[params.social]]
  name = "Github"
  icon = "fa-brands fa-github fa-2x"
  weight = 1
  url = "https://github.com/thaonbt/"

[[params.social]]
  name = "RSS"
  icon = "fa-solid fa-rss fa-2x"
  weight = 2
  url = "https://thaonbt.github.io/index.xml"
  rel = "alternate"
  type = "application/rss+xml"

[[languages.en.menu.main]]
  name = "About"
  weight = 1
  url = "about/"

[[languages.en.menu.main]]
  name = "Blog"
  weight = 2
  url = "posts/"

[[languages.en.menu.main]]
  name = "Projects"
  weight = 3
  url = "projects/"